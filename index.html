/* ================= CONTROLE DOS ATENDIMENTOS ================= */

const CONCLUIDOS_KEY = "rotaPiscinasConcluidos";

let concluidos = JSON.parse(
  localStorage.getItem(CONCLUIDOS_KEY) || "{}"
);

function chaveCliente(cliente) {
  return cliente.dia + "|" +
         cliente.nome + "|" +
         cliente.endereco;
}

function salvarConcluidos() {

  localStorage.setItem(
    CONCLUIDOS_KEY,
    JSON.stringify(concluidos)
  );

}


/* ================= MARCAR CONCLUÍDO ================= */

function alternarConcluido(index) {

  const cliente = clientes[index];

  const chave = chaveCliente(cliente);

  concluidos[chave] = !concluidos[chave];

  salvarConcluidos();

  mostrarClientes();

}


/* ================= INICIAR ROTA ================= */

function iniciarRota() {

  const pendente = clientes.find(
    cliente => !concluidos[chaveCliente(cliente)]
  );

  if (!pendente) {

    alert(
      "🎉 Todos os atendimentos estão concluídos!"
    );

    return;
  }

  const mapa =
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    encodeURIComponent(pendente.endereco) +
    "&travelmode=driving";

  window.open(mapa, "_blank");

}


/* ================= RESETAR ================= */

function resetarConcluidos() {

  if (
    confirm(
      "Deseja realmente apagar todos os atendimentos concluídos?"
    )
  ) {

    concluidos = {};

    salvarConcluidos();

    mostrarClientes();

  }

}


/* ================= CONTADOR ================= */

function atualizarProgresso() {

  const total = clientes.length;

  const feitos =
    clientes.filter(
      cliente =>
        concluidos[chaveCliente(cliente)]
    ).length;

  document.getElementById(
    "progresso"
  ).textContent =
    "✅ " +
    feitos +
    "/" +
    total +
    " atendimentos concluídos";

}


/* ================= MOSTRAR CLIENTES ================= */

function mostrarClientes() {

  const lista =
    document.getElementById("lista");

  let html = "";

  let diaAtual = "";


  clientes.forEach(
    (cliente, index) => {

      if (
        cliente.dia !== diaAtual
      ) {

        diaAtual =
          cliente.dia;

        html += `
          <div class="dia">
            📅 ${cliente.dia}
          </div>
        `;

      }


      const mapa =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
          cliente.endereco
        );


      const feito =
        !!concluidos[
          chaveCliente(cliente)
        ];


      html += `

        <div class="cliente ${
          feito ? "concluido" : ""
        }">

          <strong>
            ${cliente.nome}
          </strong>

          <div class="endereco">
            📍 ${cliente.endereco}
          </div>

          <div class="horario">
            ⏰ ${
              cliente.horario ||
              "Sem horário definido"
            }
          </div>

          <a
            class="mapa"
            href="${mapa}"
            target="_blank"
          >
            🗺️ Abrir no Google Maps
          </a>

          <button
            class="btn-concluir ${
              feito ? "feito" : ""
            }"
            onclick="alternarConcluido(${index})"
          >
            ${
              feito
                ? "↩️ Desmarcar concluído"
                : "✅ Concluído"
            }
          </button>

        </div>

      `;

    }
  );


  lista.innerHTML = html;

  atualizarProgresso();

}


mostrarClientes();
