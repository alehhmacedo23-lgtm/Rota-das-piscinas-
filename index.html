<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota das Piscinas</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f2f7fa;
  color: #222;
}

header {
  background: #087ea4;
  color: white;
  padding: 22px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 7px 0 0;
}

.container {
  padding: 18px;
  max-width: 650px;
  margin: auto;
}

.card {
  background: white;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.dia {
  background: #087ea4;
  color: white;
  padding: 12px;
  border-radius: 10px;
  margin-top: 18px;
  font-size: 18px;
  font-weight: bold;
}

.cliente {
  border-bottom: 1px solid #ddd;
  padding: 15px 0;
}

.cliente.concluido {
  opacity: 0.6;
  background: #eef8ef;
  padding: 15px 10px;
  border-radius: 10px;
}

.cliente.concluido strong {
  text-decoration: line-through;
}

.cliente strong {
  font-size: 18px;
}

.endereco {
  margin: 7px 0;
  color: #555;
}

.horario {
  color: #087ea4;
  font-weight: bold;
  margin: 6px 0;
}

.mapa {
  display: inline-block;
  margin-top: 8px;
  color: #087ea4;
  font-weight: bold;
  text-decoration: none;
}

.contador {
  background: #e8f6fa;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  margin-bottom: 15px;
}

.progresso {
  margin-top: 8px;
  font-size: 14px;
  font-weight: normal;
}

.acoes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #087ea4;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.acoes button {
  margin-top: 0;
}

.btn-rota {
  background: #087ea4;
}

.btn-reset {
  background: #777;
}

.btn-concluir {
  background: #168a4a;
  font-size: 14px;
  padding: 10px;
}

.btn-concluir.feito {
  background: #777;
}


/* ================= ENTREGAS / PRODUTOS ================= */

.entregas-box {
  margin-top: 20px;
}

.entregas-box h2 {
  margin-top: 0;
  color: #087ea4;
  font-size: 21px;
}

.form-grid {
  display: grid;
  gap: 10px;
}

.form-grid input,
.form-grid textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 15px;
  background: white;
}

.form-grid textarea {
  min-height: 75px;
  resize: vertical;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  font-size: 15px;
}

.checkbox-row input {
  width: auto;
}

.btn-salvar-entrega {
  background: #168a4a;
}

.entrega-item {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 13px;
  margin-top: 10px;
  background: white;
}

.entrega-item.concluida {
  opacity: 0.65;
  background: #eef8ef;
}

.entrega-item strong {
  font-size: 17px;
}

.entrega-meta {
  margin-top: 6px;
  color: #555;
  line-height: 1.5;
}

.btn-entrega {
  font-size: 14px;
  padding: 10px;
}

.btn-entrega-concluir {
  background: #168a4a;
}

.btn-entrega-concluir.feito {
  background: #777;
}

.btn-entrega-excluir {
  background: #b3261e;
}

.entrega-vazia {
  margin-top: 12px;
  color: #777;
  text-align: center;
}

.separador {
  height: 1px;
  background: #ddd;
  margin: 25px 0;
}

/* ========================================================= */
/* ================= CONTROLE DOS CLIENTES ================= */
/* ========================================================= */

const CONCLUIDOS_KEY = "rotaPiscinasConcluidos";

let concluidos = JSON.parse(
  localStorage.getItem(CONCLUIDOS_KEY) || "{}"
);


function chaveCliente(cliente) {

  return cliente.dia + "|" +
         cliente.nome + "|" +
         cliente.endereco;

}


function salvarConcluidos() {

  localStorage.setItem(
    CONCLUIDOS_KEY,
    JSON.stringify(concluidos)
  );

}



/* ================= MARCAR CONCLUÍDO ================= */

function alternarConcluido(index) {

  const cliente = clientes[index];

  const chave = chaveCliente(cliente);

  concluidos[chave] = !concluidos[chave];

  salvarConcluidos();

  mostrarClientes();

}



/* ================= INICIAR ROTA ================= */

function iniciarRota() {

  const pendente = clientes.find(
    cliente => !concluidos[chaveCliente(cliente)]
  );


  if (!pendente) {

    alert(
      "🎉 Todos os atendimentos estão concluídos!"
    );

    return;

  }


  const mapa =
    "https://www.google.com/maps/dir/?api=1" +
    "&destination=" +
    encodeURIComponent(pendente.endereco) +
    "&travelmode=driving";


  window.open(mapa, "_blank");

}



/* ================= RESETAR ================= */

function resetarConcluidos() {

  if (
    confirm(
      "Deseja realmente apagar todos os atendimentos concluídos?"
    )
  ) {

    concluidos = {};

    salvarConcluidos();

    mostrarClientes();

  }

}



/* ================= CONTADOR ================= */

function atualizarProgresso() {

  const total = clientes.length;


  const feitos =
    clientes.filter(
      cliente =>
        concluidos[chaveCliente(cliente)]
    ).length;


  document.getElementById(
    "progresso"
  ).textContent =
    "✅ " +
    feitos +
    "/" +
    total +
    " atendimentos concluídos";

}



/* ================= MOSTRAR CLIENTES ================= */

function mostrarClientes() {

  const lista =
    document.getElementById("lista");


  let html = "";

  let diaAtual = "";


  clientes.forEach(
    (cliente, index) => {


      if (
        cliente.dia !== diaAtual
      ) {

        diaAtual =
          cliente.dia;


        html += `
          <div class="dia">
            📅 ${cliente.dia}
          </div>
        `;

      }


      const mapa =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
          cliente.endereco
        );


      const feito =
        !!concluidos[
          chaveCliente(cliente)
        ];


      html += `

        <div class="cliente ${
          feito ? "concluido" : ""
        }">

          <strong>
            ${escapeHtml(cliente.nome)}
          </strong>

          <div class="endereco">
            📍 ${escapeHtml(cliente.endereco)}
          </div>

          <div class="horario">
            ⏰ ${
              escapeHtml(
                cliente.horario ||
                "Sem horário definido"
              )
            }
          </div>

          <a
            class="mapa"
            href="${mapa}"
            target="_blank"
            rel="noopener"
          >
            🗺️ Abrir no Google Maps
          </a>

          <button
            class="btn-concluir ${
              feito ? "feito" : ""
            }"
            onclick="alternarConcluido(${index})"
          >
            ${
              feito
                ? "↩️ Desmarcar concluído"
                : "✅ Concluído"
            }
          </button>

        </div>

      `;

    }
  );


  lista.innerHTML = html;

  atualizarProgresso();

}



/* ========================================================= */
/* ===================== ENTREGAS =========================== */
/* ========================================================= */


const ENTREGAS_KEY = "entregasProdutos";


function obterEntregas() {

  try {

    return JSON.parse(
      localStorage.getItem(ENTREGAS_KEY) || "[]"
    );

  } catch (erro) {

    console.error(
      "Erro ao carregar entregas:",
      erro
    );

    return [];

  }

}



/* ================= SALVAR ENTREGA ================= */

function salvarEntrega() {

  const cliente =
    document
      .getElementById("entregaCliente")
      .value
      .trim();


  const endereco =
    document
      .getElementById("entregaEndereco")
      .value
      .trim();


  const produto =
    document
      .getElementById("entregaProduto")
      .value
      .trim();


  const quantidade =
    document
      .getElementById("entregaQuantidade")
      .value
      .trim();


  const data =
    document
      .getElementById("entregaData")
      .value;


  const hora =
    document
      .getElementById("entregaHora")
      .value;


  const observacoes =
    document
      .getElementById("entregaObservacoes")
      .value
      .trim();


  const lembrete =
    document
      .getElementById("entregaLembrete")
      .checked;



  if (!cliente) {

    alert("Informe o cliente.");

    document
      .getElementById("entregaCliente")
      .focus();

    return;

  }


  if (!endereco) {

    alert("Informe o endereço.");

    document
      .getElementById("entregaEndereco")
      .focus();

    return;

  }


  if (!produto) {

    alert("Informe o produto.");

    document
      .getElementById("entregaProduto")
      .focus();

    return;

  }


  if (!quantidade) {

    alert("Informe a quantidade.");

    document
      .getElementById("entregaQuantidade")
      .focus();

    return;

  }


  if (!data) {

    alert("Informe a data da entrega.");

    document
      .getElementById("entregaData")
      .focus();

    return;

  }


  if (!hora) {

    alert("Informe o horário da entrega.");

    document
      .getElementById("entregaHora")
      .focus();

    return;

  }



  const entrega = {

    id: Date.now(),

    cliente: cliente,

    endereco: endereco,

    produto: produto,

    quantidade: quantidade,

    data: data,

    hora: hora,

    observacoes: observacoes,

    lembrete: lembrete,

    entregue: false,

    criadoEm: new Date().toISOString()

  };


  const entregas =
    obterEntregas();


  entregas.push(entrega);


  localStorage.setItem(
    ENTREGAS_KEY,
    JSON.stringify(entregas)
  );



  document
    .getElementById("entregaCliente")
    .value = "";


  document
    .getElementById("entregaEndereco")
    .value = "";


  document
    .getElementById("entregaProduto")
    .value = "";


  document
    .getElementById("entregaQuantidade")
    .value = "";


  document
    .getElementById("entregaData")
    .value = "";


  document
    .getElementById("entregaHora")
    .value = "";


  document
    .getElementById("entregaObservacoes")
    .value = "";


  document
    .getElementById("entregaLembrete")
    .checked = false;


  mostrarEntregas();


  alert(
    "📦 Entrega cadastrada com sucesso!"
  );

}



/* ================= ALTERAR ENTREGA ================= */

function alternarEntrega(id) {

  const entregas =
    obterEntregas();


  const entrega =
    entregas.find(
      item => item.id === id
    );


  if (!entrega) {

    return;

  }


  entrega.entregue =
    !entrega.entregue;


  localStorage.setItem(
    ENTREGAS_KEY,
    JSON.stringify(entregas)
  );


  mostrarEntregas();

}



/* ================= EXCLUIR ENTREGA ================= */

function excluirEntrega(id) {

  const confirmar =
    confirm(
      "Deseja realmente excluir esta entrega?"
    );


  if (!confirmar) {

    return;

  }


  let entregas =
    obterEntregas();


  entregas =
    entregas.filter(
      item => item.id !== id
    );


  localStorage.setItem(
    ENTREGAS_KEY,
    JSON.stringify(entregas)
  );


  mostrarEntregas();

}



/* ================= FORMATAR DATA ================= */

function formatarDataEntrega(data) {

  if (!data) {

    return "";

  }


  const partes =
    data.split("-");


  if (partes.length !== 3) {

    return data;

  }


  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );

}



/* ================= ESCAPAR HTML ================= */

function escapeHtml(valor) {

  if (valor === null || valor === undefined) {

    return "";

  }


  return String(valor)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}



/* ================= MOSTRAR ENTREGAS ================= */

function mostrarEntregas() {

  const lista =
    document.getElementById(
      "listaEntregas"
    );


  if (!lista) {

    return;

  }


  const entregas =
    obterEntregas();


  if (entregas.length === 0) {

    lista.innerHTML = `
      <div class="entrega-vazia">
        📭 Nenhuma entrega cadastrada.
      </div>
    `;

    return;

  }



  entregas.sort(
    (a, b) => {

      const dataA =
        (a.data || "") +
        " " +
        (a.hora || "");

      const dataB =
        (b.data || "") +
        " " +
        (b.hora || "");

      return dataA.localeCompare(dataB);

    }
  );



  let html = "";



  entregas.forEach(
    entrega => {


      const classe =
        entrega.entregue
          ? "entrega-item concluida"
          : "entrega-item";


      const status =
        entrega.entregue
          ? "✅ Entregue"
          : "⏳ Pendente";


      html += `

        <div class="${classe}">

          <strong>
            📦 ${escapeHtml(entrega.produto)}
          </strong>

          <div class="entrega-meta">

            👤 <strong>Cliente:</strong>
            ${escapeHtml(entrega.cliente)}
            <br>

            📍 <strong>Endereço:</strong>
            ${escapeHtml(entrega.endereco)}
            <br>

            🔢 <strong>Quantidade:</strong>
            ${escapeHtml(entrega.quantidade)}
            <br>

            📅 <strong>Data:</strong>
            ${formatarDataEntrega(entrega.data)}
            <br>

            ⏰ <strong>Horário:</strong>
            ${escapeHtml(entrega.hora)}
            <br>

            📌 <strong>Status:</strong>
            ${status}

            ${
              entrega.observacoes
                ? `
                  <br>
                  📝 <strong>Observações:</strong>
                  ${escapeHtml(entrega.observacoes)}
                `
                : ""
            }

            ${
              entrega.lembrete
                ? `
                  <br>
                  🔔 <strong>Lembrete ativado</strong>
                `
                : ""
            }

          </div>


          <button
            class="btn-entrega btn-entrega-concluir ${
              entrega.entregue ? "feito" : ""
            }"
            onclick="alternarEntrega(${entrega.id})"
          >
            ${
              entrega.entregue
                ? "↩️ Marcar como pendente"
                : "✅ Marcar como entregue"
            }
          </button>


          <button
            class="btn-entrega btn-entrega-excluir"
            onclick="excluirEntrega(${entrega.id})"
          >
            🗑️ Excluir
          </button>

        </div>

      `;

    }
  );


  lista.innerHTML = html;

}



/* ========================================================= */
/* ====================== INICIALIZAÇÃO ===================== */
/* ========================================================= */


mostrarClientes();

mostrarEntregas();


</script>
