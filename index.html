}

}

}

.horario {

.mapa {

  font-weight: bold;

.contador {
  background: #e8f6fa;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  margin-bottom: 15px;
}

button {

  font-size: 16px;

</style>
</head>

function mostrarClientes() {

  const lista = document.getElementById("lista");

  let html = "";
  let diaAtual = "";

  clientes.forEach((cliente, index) => {

    if (cliente.dia !== diaAtual) {

      diaAtual = cliente.dia;

      html += `
        <div class="dia">
          📅 ${cliente.dia}
        </div>
      `;
    }

    const mapa =
      "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(cliente.endereco);

    html += `
      <div class="cliente">

        <strong>
          ${cliente.nome}
        </strong>

        <div class="endereco">
          📍 ${cliente.endereco}
        </div>

        <div class="horario">
          ⏰ ${cliente.horario || "Sem horário definido"}
        </div>

        <a class="mapa"
           href="${mapa}"
           target="_blank">
           🗺️ Abrir no Google Maps
        </a>

      </div>
    `;
  });

  lista.innerHTML = html;
}
