<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota das Piscinas</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f2f7fa;
  color: #222;
}

header {
  background: #087ea4;
  color: white;
  padding: 22px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 7px 0 0;
}

.container {
  padding: 18px;
  max-width: 650px;
  margin: auto;
}

.card {
  background: white;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.dia {
  background: #087ea4;
  color: white;
  padding: 12px;
  border-radius: 10px;
  margin-top: 18px;
  font-size: 18px;
  font-weight: bold;
}

.cliente {
  border-bottom: 1px solid #ddd;
  padding: 15px 0;
}

.cliente.concluido {
  opacity: 0.6;
  background: #eef8ef;
  padding: 15px 10px;
  border-radius: 10px;
}

.cliente.concluido strong {
  text-decoration: line-through;
}

.cliente strong {
  font-size: 18px;
}

.endereco {
  margin: 7px 0;
  color: #555;
}

.horario {
  color: #087ea4;
  font-weight: bold;
  margin: 6px 0;
}

.mapa {
  display: inline-block;
  margin-top: 8px;
  color: #087ea4;
  font-weight: bold;
  text-decoration: none;
}

.contador {
  background: #e8f6fa;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  margin-bottom: 15px;
}

.progresso {
  margin-top: 8px;
  font-size: 14px;
  font-weight: normal;
}

.acoes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #087ea4;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

.acoes button {
  margin-top: 0;
}

.btn-rota {
  background: #087ea4;
}

.btn-reset {
  background: #777;
}

.btn-concluir {
  background: #168a4a;
  font-size: 14px;
  padding: 10px;
}

.btn-concluir.feito {
  background: #777;
}

/* ================= ENTREGAS / PRODUTOS ================= */

.entregas-box {
  margin-top: 15px;
}

.entregas-box h2 {
  margin-top: 0;
  color: #087ea4;
  font-size: 21px;
}

.form-grid {
  display: grid;
  gap: 10px;
}

.form-grid input,
.form-grid textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 15px;
  background: white;
}

.form-grid textarea {
  min-height: 75px;
  resize: vertical;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  font-size: 15px;
}

.checkbox-row input {
  width: auto;
}

.btn-salvar-entrega {
  background: #168a4a;
}

.entrega-item {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
}

.entrega-item.concluida {
  opacity: 0.65;
  background: #eef8ef;
}

.entrega-item strong {
  font-size: 17px;
}

.entrega-meta {
  margin-top: 5px;
  color: #555;
}

.btn-entrega {
  font-size: 14px;
  padding: 10px;
}

.entrega-vazia {
  margin-top: 12px;
  color: #777;
  text-align: center;
}

</style>
</head>

<body>

<header>
  <h1>🏊 Rota das Piscinas</h1>
  <p>Organize suas visitas, endereços e entregas</p>
</header>

<div class="container">

<!-- ================= ROTAS ================= -->

<div class="card">

  <div class="contador">

    👥 42 cadastros de clientes<br>

    📅 57 atendimentos semanais

    <div id="progresso" class="progresso">
      ✅ 0/57 atendimentos concluídos
    </div>
